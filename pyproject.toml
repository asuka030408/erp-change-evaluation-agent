[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-change-evaluation"
version = "0.1.0"
description = "Evidence-first ERP change impact assessment agent"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "jieba>=0.42,<1",
  "openai>=2,<3",
  "pypdf>=6,<8",
  "python-docx>=1.2,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
erp-change = "erp_change_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
erp_change_agent = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
